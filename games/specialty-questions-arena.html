<main class="shell"><a class="back" href="../index.html">← Government OST Review Hub</a><header class="hero"><div class="eyebrow">AMERICAN GOVERNMENT • OST REVIEW</div><h1>Specialty Questions Arena — American Government OST Review</h1><p>30 questions · A perfect first-attempt run earns a certificate.</p></header><section class="student-panel" id="startScreen"><h2>Student Information</h2><form id="identity"><div class="fields"><label>Student Name<input id="studentName" autocomplete="name" required></label><label>Class Period<select id="sheetPeriod" required><option value="">Choose</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label><label>School Email<input id="sheetEmail" type="email" autocomplete="email" required></label></div><div class="actions"><button type="submit">Start Game</button><button type="button" class="secondary" id="load">Load Saved Work</button></div><p id="startStatus" role="status"></p></form></section><section class="question-panel" id="gameArea" hidden><div class="question-toolbar"><p id="progress"></p><button type="button" class="secondary" id="restart">Restart Game</button></div><p id="btbCloudStatus" role="status"></p><div id="question"></div><p id="feedback" class="feedback" role="status"></p></section><section class="completion" id="results" hidden><h2>Game Results</h2><p id="resultMessage"></p><section id="certificate" class="source-box" hidden><h2>100% Perfect Run</h2><p id="certName" class="ticket-name"></p><h3>Specialty Questions Arena — American Government OST Review</h3><p id="certStart"></p><p id="certEnd"></p></section><p id="finalStatus" role="status"></p><div class="actions"><button type="button" id="print" hidden>Print Certificate</button><button type="button" class="secondary" id="replay">Restart Game</button></div></section></main>
<script src="basics-audit.js"></script><script id="deck" type="application/json">[{"prompt":"Read the excerpt, then answer Part A and Part B.","reading":"Fourth Amendment: The right of the people to be secure in their persons, houses, papers, and effects, against unreasonable searches and seizures, shall not be violated, and no Warrants shall issue, but upon probable cause. Fifth Amendment: No person shall be held to answer for a capital, or otherwise infamous crime, unless on a presentment or indictment of a Grand Jury. Sixth Amendment: In all criminal prosecutions, the accused shall enjoy the right to a speedy and public trial...and to have the Assistance of Counsel for his defence. Eighth Amendment: Excessive bail shall not be required, nor excessive fines imposed, nor cruel and unusual punishments inflicted. In 1961, Clarence Gideon was convicted of a felony. During his trial, Gideon requested that the court appoint him an attorney because he could not afford one. The judge denied his request. The Supreme Court later ruled that Gideon's constitutional rights had been violated.","readingTitle":"Gideon v. Wainwright","hint":"Gideon focuses on right to counsel and applying Bill of Rights protections to the states.","explanation":"Sixth Amendment | Doctrine of Incorporation → apply protections of the Bill of Rights to the state governments — Gideon focuses on right to counsel and applying Bill of Rights protections to the states.","parts":[{"prompt":"Part A: Which constitutional amendment served as the basis for the Court's ruling?","choices":["Fourth Amendment","Fifth Amendment","Sixth Amendment","Eighth Amendment"],"keys":[2],"mode":"single"},{"prompt":"Part B: Which doctrine did the Court rely on, and what did that allow it to do?","choices":["Necessary and Proper Clause → carry out enumerated powers","Separation of Powers → overrule laws made by the legislative branch","Doctrine of Incorporation → apply protections of the Bill of Rights to the state governments","Doctrine of Incorporation → carry out enumerated powers"],"keys":[2],"mode":"single"}],"id":"q01"},{"prompt":"Identify whether each constitutional provision would most likely be supported by Federalists or Anti-Federalists.","hint":"Think stronger national government versus added protections against government abuse.","explanation":"Federalist | Anti-Federalist | Anti-Federalist | Federalist — Think stronger national government versus added protections against government abuse.","parts":[{"prompt":"“No state shall enter into any treaty, alliance, or confederation”","choices":["Federalist","Anti-Federalist"],"keys":[0],"mode":"select"},{"prompt":"In all criminal prosecutions, the accused shall enjoy the right to a speedy and public trial...","choices":["Federalist","Anti-Federalist"],"keys":[1],"mode":"select"},{"prompt":"Congress shall make no law abridging the freedom of speech","choices":["Federalist","Anti-Federalist"],"keys":[1],"mode":"select"},{"prompt":"The Constitution shall be the supreme law of the land","choices":["Federalist","Anti-Federalist"],"keys":[0],"mode":"select"}],"id":"q02"},{"prompt":"Read the excerpt, then answer Part A and Part B.","reading":"“No person acting under color of law shall in determining whether any individual is qualified under State law or laws to vote in any Federal election, apply any standard, practice, or procedure different from the standards, practices, or procedures applied under such law or laws to other individuals...”","readingTitle":"Civil Rights Act of 1964","hint":"Voting protections help preserve rule by the people.","explanation":"popular sovereignty | to provide protections for voters facing discrimination — Voting protections help preserve rule by the people.","parts":[{"prompt":"Part A: Which basic principle of the Constitution was reinforced as a result of this act?","choices":["popular sovereignty","checks and balances","separation of powers","separation of church and state"],"keys":[0],"mode":"single"},{"prompt":"Part B: Why was this excerpt needed to reinforce the principle you selected in Part A?","choices":["to provide protections for voters facing discrimination","to clarify when courts could review voting rights cases","to remove federal oversight from local and state elections","to limit the influence of religious groups on elections"],"keys":[0],"mode":"single"}],"id":"q03"},{"prompt":"Read the time line, then answer Part A and Part B.","reading":"Impoundment is a refusal by the president to spend funds allocated for a specific purpose by Congress. 1803—President Thomas Jefferson became the first president to use impoundment when he refused to spend money Congress had allocated to purchase gunboats. 1972—Congress passed the Clean Water Act. President Nixon vetoed the bill, Congress overrode the veto, and Nixon then withheld much of the money allocated by the Act. 1974—Congress passed the Impoundment Control Act, requiring the president to ask Congress to reduce funding rather than impounding it unilaterally. 1975—Several municipalities, including New York City, sued the EPA director in Train v. City of New York. The Supreme Court ruled that the president could not impound funds lawfully allocated by Congress.","readingTitle":"Impoundment","hint":"Federalism shows up when municipalities challenge federal action. Scholarly journals provide expert research, records provide facts, editorials provide opinions.","explanation":"1975 | Expert research about the events | Specific facts about the events | Opinions of people at the time of the events — Federalism shows up when municipalities challenge federal action. Scholarly journals provide expert research, records provide facts, editorials provide opinions.","parts":[{"prompt":"Part A: In which year do the events in the timeline best illustrate the principle of federalism?","choices":["1803","1972","1974","1975"],"keys":[3],"mode":"single"},{"prompt":"An article in a scholarly journal about President Jefferson's use of impoundment","choices":["Specific facts about the events","Opinions of people at the time of the events","Expert research about the events"],"keys":[2],"mode":"select"},{"prompt":"A record of the testimony in the Supreme Court case Train v. City of New York","choices":["Specific facts about the events","Opinions of people at the time of the events","Expert research about the events"],"keys":[0],"mode":"select"},{"prompt":"An editorial article written by a lawmaker about the Impoundment Control Act of 1974","choices":["Specific facts about the events","Opinions of people at the time of the events","Expert research about the events"],"keys":[1],"mode":"select"}],"id":"q04"},{"prompt":"Read the treaty scenario, then answer Part A and Part B.","reading":"The president is trying to secure approval of a treaty he helped draft. A treaty must be approved by two-thirds of the Senate. Advisors report that the Senate is divided and several strategies have been proposed to build support.","readingTitle":"Ratifying a Treaty","hint":"Part A looks at likely impact on Senate approval. Part B asks for actual negotiation, not threats or publicity.","explanation":"Little or No Impact | Decrease | Increase | Decrease | Meet with a group of senators opposed to the treaty to discuss their concerns.; Hold meetings with members of both parties to settle differences on aspects of the treaty. — Part A looks at likely impact on Senate approval. Part B asks for actual negotiation, not threats or publicity.","parts":[{"prompt":"Part A · 1. The president is a close friend of the chief justice of the Supreme Court.","choices":["Increase","Decrease","Little or No Impact"],"keys":[2],"mode":"select"},{"prompt":"Part A · 2. There is little public interest in the treaty, but a vocal minority of the public is highly opposed to it.","choices":["Increase","Decrease","Little or No Impact"],"keys":[1],"mode":"select"},{"prompt":"Part A · 3. Interest groups that favor the treaty are contributing large sums of money to lawmakers’ campaign funds.","choices":["Increase","Decrease","Little or No Impact"],"keys":[0],"mode":"select"},{"prompt":"Part A · 4. Political parties are encouraging their members to hold to their original positions in order to appear decisive and unified ahead of an upcoming election.","choices":["Increase","Decrease","Little or No Impact"],"keys":[1],"mode":"select"},{"prompt":"Part B: Select the two strategies that represent forms of negotiation.","choices":["Threaten to veto all bills until the Senate approves the treaty.","Conduct media interviews about the treaty and why it should be approved.","Meet with a group of senators opposed to the treaty to discuss their concerns.","Give a speech to the Senate outlining reasons that they should approve the treaty.","Hold meetings with members of both parties to settle differences on aspects of the treaty."],"keys":[2,4],"mode":"multi"}],"id":"q05"},{"prompt":"A group of citizens wants to persuade a city mayor to add bike lanes along the sides of roads. Select all of the statements the group can use to persuade the mayor.","hint":"Choose the statements that directly strengthen the case for adding bike lanes.","explanation":"Bike lanes reduce crashes and make sidewalks more pedestrian friendly.; As an alternative to car travel, bike lanes may help reduce vehicle emissions in the city. — Choose the statements that directly strengthen the case for adding bike lanes.","parts":[{"prompt":"","choices":["Bike lanes reduce crashes and make sidewalks more pedestrian friendly.","As an alternative to car travel, bike lanes may help reduce vehicle emissions in the city.","The idea of adding bike lanes requires further investigation.","Bike lanes in other cities have increased commuting time for drivers.","Bike lanes might decrease the revenue of the city's bus system."],"keys":[0,1],"mode":"multi"}],"id":"q06"},{"prompt":"The federal government can try to stimulate economic growth by ________ or ________. Select the two answers that apply.","hint":"Expansionary fiscal policy increases spending and cuts taxes.","explanation":"increasing government spending; decreasing taxes on people — Expansionary fiscal policy increases spending and cuts taxes.","parts":[{"prompt":"","choices":["increasing government spending","decreasing taxes on people","decreasing government spending","increasing taxes on people"],"keys":[0,1],"mode":"multi"}],"id":"q07"},{"prompt":"The federal government can try to slow economic growth by ________ or ________. Select the two answers that apply.","hint":"Contractionary fiscal policy reduces spending and raises taxes.","explanation":"decreasing government spending; increasing taxes on people — Contractionary fiscal policy reduces spending and raises taxes.","parts":[{"prompt":"","choices":["decreasing government spending","increasing taxes on people","increasing government spending","decreasing taxes on people"],"keys":[0,1],"mode":"multi"}],"id":"q08"},{"prompt":"Citizens can directly support their local communities in various ways. Select three ways citizens could directly support their local communities.","hint":"Look for local, community-centered roles.","explanation":"Serving as a volunteer firefighter; Starting a neighborhood watch; Running for City Council — Look for local, community-centered roles.","parts":[{"prompt":"","choices":["Serving as a volunteer firefighter","Starting a neighborhood watch","Running for City Council","Becoming a Supreme Court Justice","Serving in the U.S. Army and Navy","Running for President"],"keys":[0,1,2],"mode":"multi"}],"id":"q09"},{"prompt":"In the 1950s and 1960s, all three branches of the federal government acted to extend civil rights to African Americans. Match each branch with an action it took.","hint":"Think enforcement, lawmaking, and interpretation.","explanation":"Executive | Legislative | Judicial — Think enforcement, lawmaking, and interpretation.","parts":[{"prompt":"Sent the National Guard to enforce desegregation in the South","choices":["Executive","Legislative","Judicial"],"keys":[0],"mode":"select"},{"prompt":"Outlawed discrimination in public places","choices":["Executive","Legislative","Judicial"],"keys":[1],"mode":"select"},{"prompt":"Applied due process clause to extend basic rights","choices":["Executive","Legislative","Judicial"],"keys":[2],"mode":"select"}],"id":"q10"},{"prompt":"Citizens of Ohio have a variety of options available for participation in state and local government. Select whether each is state or local.","hint":"City and neighborhood actions are local. Governor and National Guard are state-level.","explanation":"Local Government | State Government | Local Government | State Government — City and neighborhood actions are local. Governor and National Guard are state-level.","parts":[{"prompt":"Attend city and/or township trustee meetings","choices":["State Government","Local Government"],"keys":[1],"mode":"select"},{"prompt":"Serve in the National Guard","choices":["State Government","Local Government"],"keys":[0],"mode":"select"},{"prompt":"Organize a neighborhood watch","choices":["State Government","Local Government"],"keys":[1],"mode":"select"},{"prompt":"Vote for Governor","choices":["State Government","Local Government"],"keys":[0],"mode":"select"}],"id":"q11"},{"prompt":"In 1851, Ohio drafted a new constitution to address problems with the original constitution. Select all the ways the 1851 constitution addressed these problems.","hint":"Think judicial reform, debt limits, and reducing legislative dominance.","explanation":"It created district courts; It instituted debt limitations; It required major executive officials to be elected into office; Judges were elected by the people — Think judicial reform, debt limits, and reducing legislative dominance.","parts":[{"prompt":"","choices":["It created district courts","It instituted debt limitations","It required major executive officials to be elected into office","Judges were elected by the people","It forgave all outstanding state debt","It restricted the number of cases that could be brought to trial each year"],"keys":[0,1,2,3],"mode":"multi"}],"id":"q12"},{"prompt":"In Gibbons v. Ogden, the Supreme Court used ___, the case involved the constitutional principle of ___, and the result was that ___.","hint":"The Court interpreted the Constitution in a dispute over interstate commerce and state power.","explanation":"judicial review | federalism | power of Congress over the states was upheld — The Court interpreted the Constitution in a dispute over interstate commerce and state power.","parts":[{"prompt":"Blank 1","choices":["legislation","judicial review","amending"],"keys":[1],"mode":"select"},{"prompt":"Blank 2","choices":["popular sovereignty","federalism","checks and balances"],"keys":[1],"mode":"select"},{"prompt":"Blank 3","choices":["rights of citizens increased","power of Congress over the states was upheld","power of the federal government was limited"],"keys":[1],"mode":"select"}],"id":"q13"},{"prompt":"Match each situation with the most appropriate citizen action.","hint":"Match the issue to the level of government that can address it.","explanation":"Sign a petition that will be sent to the president | Speak at a city council meeting | Write letters to the governor and members of the General Assembly | Campaign for a challenger running against a current U.S. senator — Match the issue to the level of government that can address it.","parts":[{"prompt":"A citizen disagrees with an executive order that impacts national foreign policy","choices":["Write letters to the governor and members of the General Assembly","Campaign for a challenger running against a current U.S. senator","Sign a petition that will be sent to the president","Speak at a city council meeting"],"keys":[2],"mode":"select"},{"prompt":"A citizen believes that a new playground should be built in a neighborhood park","choices":["Write letters to the governor and members of the General Assembly","Campaign for a challenger running against a current U.S. senator","Sign a petition that will be sent to the president","Speak at a city council meeting"],"keys":[3],"mode":"select"},{"prompt":"A citizen fears the environmental impact of a state road construction project","choices":["Write letters to the governor and members of the General Assembly","Campaign for a challenger running against a current U.S. senator","Sign a petition that will be sent to the president","Speak at a city council meeting"],"keys":[0],"mode":"select"},{"prompt":"A citizen believes that her views are being poorly represented at the congressional level","choices":["Write letters to the governor and members of the General Assembly","Campaign for a challenger running against a current U.S. senator","Sign a petition that will be sent to the president","Speak at a city council meeting"],"keys":[1],"mode":"select"}],"id":"q14"},{"prompt":"Select whether each statement reflects a Federalist or Anti-Federalist position.","hint":"Federalists favored a stronger national government. Anti-Federalists wanted more limits and more protection of liberties.","explanation":"Anti-Federalist | Anti-Federalist | Federalist | Federalist | Anti-Federalist — Federalists favored a stronger national government. Anti-Federalists wanted more limits and more protection of liberties.","parts":[{"prompt":"The Supremacy Clause places too much power in the national government.","choices":["Federalist","Anti-Federalist"],"keys":[1],"mode":"select"},{"prompt":"The inclusion of a Bill of Rights is necessary to protect against government intrusion.","choices":["Federalist","Anti-Federalist"],"keys":[1],"mode":"select"},{"prompt":"The general welfare of the country is a greater concern than individual state sovereignty.","choices":["Federalist","Anti-Federalist"],"keys":[0],"mode":"select"},{"prompt":"A strong national government is necessary to address problems under the Articles of Confederation.","choices":["Federalist","Anti-Federalist"],"keys":[0],"mode":"select"},{"prompt":"The powers of the national government should be clearly defined and limited relative to the powers of the state governments.","choices":["Federalist","Anti-Federalist"],"keys":[1],"mode":"select"}],"id":"q15"},{"prompt":"Select the two statements that are rights of the accused included in the Bill of Rights.","hint":"Think Fifth, Sixth, and Eighth Amendment protections tied to criminal defendants.","explanation":"It establishes protections against self-incrimination.; It establishes protections against cruel and unusual punishment. — Think Fifth, Sixth, and Eighth Amendment protections tied to criminal defendants.","parts":[{"prompt":"","choices":["It establishes protections against self-incrimination.","It establishes protections against cruel and unusual punishment.","It establishes the right to bear arms.","It establishes the right to freedom of religion.","It establishes protections against prosecution in other countries."],"keys":[0,1],"mode":"multi"}],"id":"q16"},{"prompt":"Identify whether each fiscal policy is a taxing policy or a spending policy.","hint":"Highways and benefits are spending. Deductions and fees are taxation-related.","explanation":"Spending Policy | Taxing Policy | Spending Policy | Taxing Policy — Highways and benefits are spending. Deductions and fees are taxation-related.","parts":[{"prompt":"The government decides to begin a massive effort to rebuild the nation's highways","choices":["Spending Policy","Taxing Policy"],"keys":[0],"mode":"select"},{"prompt":"The government increases deductions for households with students attending college","choices":["Spending Policy","Taxing Policy"],"keys":[1],"mode":"select"},{"prompt":"The government has extended unemployment benefits for an additional six weeks","choices":["Spending Policy","Taxing Policy"],"keys":[0],"mode":"select"},{"prompt":"The government has increased fees for consumption of gasoline","choices":["Spending Policy","Taxing Policy"],"keys":[1],"mode":"select"}],"id":"q17"},{"prompt":"Select whether each result is more likely when the Federal Reserve lowers or raises the discount rate.","hint":"Lower rates make borrowing cheaper. Higher rates make borrowing more expensive.","explanation":"Lower Discount Rate | Raise Discount Rate | Lower Discount Rate — Lower rates make borrowing cheaper. Higher rates make borrowing more expensive.","parts":[{"prompt":"People buy more houses","choices":["Lower Discount Rate","Raise Discount Rate"],"keys":[0],"mode":"select"},{"prompt":"People pay more for loans","choices":["Lower Discount Rate","Raise Discount Rate"],"keys":[1],"mode":"select"},{"prompt":"Inflation increases","choices":["Lower Discount Rate","Raise Discount Rate"],"keys":[0],"mode":"select"}],"id":"q18"},{"prompt":"Select whether each result is more likely when the Federal Reserve lowers or raises the reserve requirement.","hint":"Lower reserve requirements make more money available to lend.","explanation":"Lower Reserve Requirement | Raise Reserve Requirement | Lower Reserve Requirement — Lower reserve requirements make more money available to lend.","parts":[{"prompt":"People buy more houses","choices":["Lower Reserve Requirement","Raise Reserve Requirement"],"keys":[0],"mode":"select"},{"prompt":"People pay more for loans","choices":["Lower Reserve Requirement","Raise Reserve Requirement"],"keys":[1],"mode":"select"},{"prompt":"Inflation increases","choices":["Lower Reserve Requirement","Raise Reserve Requirement"],"keys":[0],"mode":"select"}],"id":"q19"},{"prompt":"Select whether each result is more likely when the Federal Reserve buys or sells government securities.","hint":"Buying securities adds money to the economy. Selling removes money.","explanation":"Buy Securities | Sell Securities | Buy Securities — Buying securities adds money to the economy. Selling removes money.","parts":[{"prompt":"People buy more houses","choices":["Buy Securities","Sell Securities"],"keys":[0],"mode":"select"},{"prompt":"People pay more for loans","choices":["Buy Securities","Sell Securities"],"keys":[1],"mode":"select"},{"prompt":"Inflation increases","choices":["Buy Securities","Sell Securities"],"keys":[0],"mode":"select"}],"id":"q20"},{"prompt":"Identify whether each policy is related to taxes or spending.","hint":"Spending = programs and benefits. Tax = deductions, fees, and levies.","explanation":"Spending Policy | Tax Policy | Spending Policy | Tax Policy — Spending = programs and benefits. Tax = deductions, fees, and levies.","parts":[{"prompt":"The government decides to begin a massive effort to rebuild the nation's highways.","choices":["Spending Policy","Tax Policy"],"keys":[0],"mode":"select"},{"prompt":"The government increases deductions for households with students attending college.","choices":["Spending Policy","Tax Policy"],"keys":[1],"mode":"select"},{"prompt":"The government has extended unemployment benefits for qualified workers for an additional six weeks.","choices":["Spending Policy","Tax Policy"],"keys":[0],"mode":"select"},{"prompt":"The government has increased revenues by charging extra fees for consumption of gasoline.","choices":["Spending Policy","Tax Policy"],"keys":[1],"mode":"select"}],"id":"q21"},{"prompt":"Complete the statements by matching the correct phrases.","hint":"These amendments followed the Civil War, but states often limited their effect through segregation laws.","explanation":"Reconstruction Amendments | enacted legislation that enforced racial segregation — These amendments followed the Civil War, but states often limited their effect through segregation laws.","parts":[{"prompt":"The _____ were created in part to provide constitutional protections for African Americans after the end of the Civil War.","choices":["Progressive Amendments","Bill of Rights Amendments","Reconstruction Amendments","enacted legislation that enforced racial segregation","campaigned against the amendments and got them repealed"],"keys":[2],"mode":"select"},{"prompt":"In practice, the impact of these protections was limited because some state governments _____.","choices":["Progressive Amendments","Bill of Rights Amendments","Reconstruction Amendments","enacted legislation that enforced racial segregation","campaigned against the amendments and got them repealed"],"keys":[3],"mode":"select"}],"id":"q22"},{"prompt":"Select the constitutional power that fits each branch relationship.","hint":"The president appoints federal judges. The Supreme Court can strike down laws passed by Congress.","explanation":"Appoints Judges | Can declare a law unconstitutional — The president appoints federal judges. The Supreme Court can strike down laws passed by Congress.","parts":[{"prompt":"President → Supreme Court","choices":["Appoints Judges","Approves Judges","Can declare a law unconstitutional","Can veto laws"],"keys":[0],"mode":"select"},{"prompt":"Congress ← Supreme Court","choices":["Appoints Judges","Approves Judges","Can declare a law unconstitutional","Can veto laws"],"keys":[2],"mode":"select"}],"id":"q23"},{"prompt":"Select whether each action would occur at the local or state level.","hint":"Town actions are local. General Assembly and governor actions are state level.","explanation":"Local | Local | Local | State | State — Town actions are local. General Assembly and governor actions are state level.","parts":[{"prompt":"serve in a volunteer fire department","choices":["Local","State"],"keys":[0],"mode":"select"},{"prompt":"organize a charity event to raise money for the town's police force","choices":["Local","State"],"keys":[0],"mode":"select"},{"prompt":"meet with the town's mayor to discuss the emergency services budget","choices":["Local","State"],"keys":[0],"mode":"select"},{"prompt":"run for the General Assembly on a platform of improved emergency services","choices":["Local","State"],"keys":[1],"mode":"select"},{"prompt":"sign a petition to bring the issue of emergency services to the governor's attention","choices":["Local","State"],"keys":[1],"mode":"select"}],"id":"q24"},{"prompt":"A city jails a resident solely for peaceful criticism of the mayor. Which statement best explains the constitutional protection?","reading":"The Bill of Rights originally restricted federal government. Through selective incorporation, the Supreme Court has used the Fourteenth Amendment’s Due Process Clause to apply most Bill of Rights protections to state and local government. The rights assessed here under the First, Second, Fourth, Fifth, Sixth, and Eighth Amendments apply to states. The Tenth Amendment concerns reserved powers, rather than an incorporated individual right.","hint":"Use the supporting source. Use the reference passage and Section 1 of the Fourteenth Amendment.","explanation":"Through incorporation under the Fourteenth Amendment, the First Amendment’s speech protection applies to state and local governments.","parts":[{"prompt":"","choices":["The First Amendment protects the press, so only newspapers may criticize officials","The First Amendment protects speech, but only federal officials must respect it","The First Amendment protects assembly, so a person speaking alone has no protection","Incorporation applies First Amendment speech rights locally"],"keys":[3],"mode":"single"}],"topic":"First Amendment — incorporation","id":"q25"},{"prompt":"State officers search a home without a warrant, probable cause, or any valid exception. Officials claim the Fourth Amendment limits only federal officers. Which response is most accurate?","reading":"The Bill of Rights originally restricted federal government. Through selective incorporation, the Supreme Court has used the Fourteenth Amendment’s Due Process Clause to apply most Bill of Rights protections to state and local government. The rights assessed here under the First, Second, Fourth, Fifth, Sixth, and Eighth Amendments apply to states. The Tenth Amendment concerns reserved powers, rather than an incorporated individual right.","hint":"Use the supporting source. Use the reference passage and the Fourth Amendment’s search-and-seizure protection.","explanation":"The Fourth Amendment’s protection against unreasonable searches applies to state and local government through incorporation.","parts":[{"prompt":"","choices":["Incorporation binds state officers to the Fourth Amendment","Its trial protection allows state officers to search any home","Its speech protection requires a confession before any search","Its search protection applies only to federal officers"],"keys":[0],"mode":"single"}],"topic":"Fourth Amendment — incorporation","id":"q26"},{"prompt":"A state argues that the right to keep and bear arms can never restrict its laws because the Bill of Rights originally limited only federal government. Which response best applies incorporation?","reading":"The Bill of Rights originally restricted federal government. Through selective incorporation, the Supreme Court has used the Fourteenth Amendment’s Due Process Clause to apply most Bill of Rights protections to state and local government. The rights assessed here under the First, Second, Fourth, Fifth, Sixth, and Eighth Amendments apply to states. The Tenth Amendment concerns reserved powers, rather than an incorporated individual right.","hint":"Use the supporting source. Use the reference passage about incorporation and identify the right in Amendment II.","explanation":"Incorporation applies the Second Amendment’s right to keep and bear arms to state governments; particular regulations still require constitutional analysis.","parts":[{"prompt":"","choices":["The Second Amendment protects only public criminal trials","The Second Amendment guarantees every state law is valid","The Second Amendment applies only to federal government","The Second Amendment also binds states"],"keys":[3],"mode":"single"}],"topic":"Second Amendment — incorporation","id":"q27"},{"prompt":"A state prison deliberately imposes a torturous punishment. Officials say the Eighth Amendment restricts only federal prisons. Which response correctly applies incorporation?","reading":"The Bill of Rights originally restricted federal government. Through selective incorporation, the Supreme Court has used the Fourteenth Amendment’s Due Process Clause to apply most Bill of Rights protections to state and local government. The rights assessed here under the First, Second, Fourth, Fifth, Sixth, and Eighth Amendments apply to states. The Tenth Amendment concerns reserved powers, rather than an incorporated individual right.","hint":"Use the supporting source. Use the reference passage and Amendment VIII’s punishment protection.","explanation":"Incorporation makes the Eighth Amendment’s ban on cruel and unusual punishment enforceable against state government.","parts":[{"prompt":"","choices":["The ban on cruel and unusual punishment applies to states too","The ban on cruel and unusual punishment applies only federally","The right to a speedy trial allows any punishment after conviction","The right to bear arms replaces punishment protections in state prisons"],"keys":[0],"mode":"single"}],"topic":"Eighth Amendment — incorporation","id":"q28"},{"prompt":"A city’s air-quality program reduces average pollution but leaves one neighborhood with high exposure. What does the evidence suggest?","reading":"The city’s report provides both a citywide average and neighborhood-level readings. Citywide averages show broad changes, while neighborhood readings show where residents still experience exposure.","readingTitle":"City air-quality report","hint":"Identify the decision-maker, the evidence needed, and the likely consequences.","explanation":"The citywide average hides remaining exposure, so officials should examine neighborhood-level data.","parts":[{"prompt":"","choices":["Officials should examine uneven outcomes and possible targeted remedies","The neighborhood should be excluded from future monitoring","No further review is needed if the citywide average declines","The program must be ended because average conditions improved"],"keys":[0],"mode":"single"}],"topic":"CS 18–19 • OST-Style Analysis","id":"q29"},{"prompt":"Which account best explains how the skills and formal procedures work together?","reading":"Board members cite evidence, exchange proposals and accept revisions to gain broad support. They then hold the formal vote required to adopt the school policy.","readingTitle":"Classroom scenario","hint":"Separate the work of reaching support from the official act that gives the decision effect.","explanation":"Persuasion, negotiation and compromise can help members develop agreement. Those skills complement rather than replace the stipulated adoption procedure.","parts":[{"prompt":"","choices":["The formal vote shows that persuasion and negotiation played no role in developing the policy","Interpersonal skills help build agreement, while the formal vote performs the required adoption","Accepting revisions transfers the board’s legal authority to whichever speaker proposed them first","The exchange of proposals already enacts the policy, making the required formal vote redundant"],"keys":[1],"mode":"single"}],"topic":"CS 4 • Democratic agreement","id":"q30"}]</script><script src="ost-game.js"></script></body></html>
