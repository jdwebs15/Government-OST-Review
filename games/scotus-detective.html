<main class="shell"><a class="back" href="../index.html">← Government OST Review Hub</a><header class="hero"><div class="eyebrow">AMERICAN GOVERNMENT • OST REVIEW</div><h1>SCOTUS Detective — Constitutional Case Files (OST Review)</h1><p>30 questions · A perfect first-attempt run earns a certificate.</p></header><section class="student-panel" id="startScreen"><h2>Student Information</h2><form id="identity"><div class="fields"><label>Student Name<input id="studentName" autocomplete="name" required></label><label>Class Period<select id="sheetPeriod" required><option value="">Choose</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label><label>School Email<input id="sheetEmail" type="email" autocomplete="email" required></label></div><div class="actions"><button type="submit">Start Game</button><button type="button" class="secondary" id="load">Load Saved Work</button></div><p id="startStatus" role="status"></p></form></section><section class="question-panel" id="gameArea" hidden><div class="question-toolbar"><p id="progress"></p><button type="button" class="secondary" id="restart">Restart Game</button></div><p id="btbCloudStatus" role="status"></p><div id="question"></div><p id="feedback" class="feedback" role="status"></p></section><section class="completion" id="results" hidden><h2>Game Results</h2><p id="resultMessage"></p><section id="certificate" class="source-box" hidden><h2>100% Perfect Run</h2><p id="certName" class="ticket-name"></p><h3>SCOTUS Detective — Constitutional Case Files (OST Review)</h3><p id="certStart"></p><p id="certEnd"></p></section><p id="finalStatus" role="status"></p><div class="actions"><button type="button" id="print" hidden>Print Certificate</button><button type="button" class="secondary" id="replay">Restart Game</button></div></section></main>
<script src="basics-audit.js"></script><script id="deck" type="application/json">[{"prompt":"According to Ohio’s standards, Marbury v. Madison is best classified as an example of constitutional government changing through which method?","reading":"The Constitution does not explicitly state that the Supreme Court may strike down acts of Congress. In Marbury v. Madison, however, the Court interpreted its role under Article III and announced that it could refuse to enforce laws that violated the Constitution.","readingTitle":"Marbury v. Madison (1803)","hint":"The change came from a Court ruling, not from Congress or an amendment.","explanation":"Supreme Court decisions — The change came from a Court ruling, not from Congress or an amendment.","parts":[{"prompt":"","choices":["Informal practices","Supreme Court decisions","Amendments","State referendums"],"keys":[1],"mode":"single"}],"id":"q01"},{"prompt":"Which constitutional principle was most directly strengthened by the Court’s ruling that Maryland could not tax the national bank?","reading":"Congress created the Second Bank of the United States. The state of Maryland attempted to tax the bank, arguing that the Constitution did not explicitly list the power to create a national bank. James McCulloch, a bank official, refused to pay the tax. The Supreme Court ruled that Congress had authority to create the bank and that Maryland could not tax it.","readingTitle":"McCulloch v. Maryland (1819)","hint":"The ruling said a state could not control a legitimate act of the national government.","explanation":"Federalism with national supremacy — The ruling said a state could not control a legitimate act of the national government.","parts":[{"prompt":"","choices":["Popular sovereignty","Federalism with national supremacy","State nullification","Direct democracy"],"keys":[1],"mode":"single"}],"id":"q02"},{"prompt":"The Court’s decision in Mapp is most directly used on the Ohio test to show that constitutional government changed through what process?","reading":"Before Mapp, the exclusionary rule mainly restrained the federal government. In Mapp v. Ohio, the Supreme Court held that the protections against unreasonable search and seizure also constrained state law enforcement in state prosecutions.","readingTitle":"Mapp v. Ohio (1961)","hint":"The change came from Court interpretation.","explanation":"A Supreme Court decision interpreting constitutional rights — The change came from Court interpretation.","parts":[{"prompt":"","choices":["An amendment proposed by state legislatures","A Supreme Court decision interpreting constitutional rights","A local referendum","An executive order by the governor"],"keys":[1],"mode":"single"}],"id":"q03"},{"prompt":"Which constitutional principle is most directly involved when one branch’s powers are defined against another branch’s attempt to limit it?","reading":"A federal law required the president to obtain Senate approval before removing certain executive officials. President Woodrow Wilson removed a postmaster without Senate consent. The Supreme Court ruled that the president had the power to remove executive officers, emphasizing the president’s authority over the executive branch.","readingTitle":"Myers v. United States (1926)","hint":"The case dealt with boundaries between branches.","explanation":"Separation of powers — The case dealt with boundaries between branches.","parts":[{"prompt":"","choices":["Separation of powers","Popular sovereignty","Federalism","Reserved rights"],"keys":[0],"mode":"single"}],"id":"q04"},{"prompt":"Which basic principle of government was strengthened when the Court limited Congress by declaring part of a law unconstitutional?","reading":"In the final days of the Adams administration, several judicial commissions were signed but not delivered before Thomas Jefferson took office. William Marbury asked the Supreme Court to order Secretary of State James Madison to deliver his commission. Chief Justice John Marshall concluded that Marbury had been wronged, but also ruled that the section of the Judiciary Act of 1789 giving the Court power to issue the order in this case conflicted with the Constitution.","readingTitle":"Marbury v. Madison (1803)","hint":"One branch checked the action of another branch.","explanation":"Checks and balances — One branch checked the action of another branch.","parts":[{"prompt":"","choices":["Checks and balances","Popular sovereignty","Republicanism","Elastic powers"],"keys":[0],"mode":"single"}],"id":"q05"},{"prompt":"What was the main effect of this case on the meaning and application of constitutional government?","reading":"The Constitution does not explicitly state that the Supreme Court may strike down acts of Congress. In Marbury v. Madison, however, the Court interpreted its role under Article III and announced that it could refuse to enforce laws that violated the Constitution.","readingTitle":"Marbury v. Madison (1803)","hint":"Think about the Court’s new role in declaring acts unconstitutional.","explanation":"It allowed the judicial branch to interpret and limit government actions under the Constitution — Think about the Court’s new role in declaring acts unconstitutional.","parts":[{"prompt":"","choices":["It expanded direct voting by citizens","It gave states control over federal courts","It allowed the judicial branch to interpret and limit government actions under the Constitution","It eliminated checks on the executive branch"],"keys":[2],"mode":"single"}],"id":"q06"},{"prompt":"Ohio often uses this case to show that constitutional government changed over time through a broader interpretation of which principle?","reading":"Chief Justice John Marshall explained that the Constitution grants Congress certain enumerated powers, but also gives Congress discretion to choose reasonable means to carry them out. He rejected Maryland’s attempt to treat federal institutions as subject to state control.","readingTitle":"McCulloch v. Maryland (1819)","hint":"The national government’s reach increased relative to state governments.","explanation":"Federalism as increased national authority over the states — The national government’s reach increased relative to state governments.","parts":[{"prompt":"","choices":["Limited government as absolute state control","Federalism as increased national authority over the states","Popular sovereignty through referendums","Checks and balances between voters and judges"],"keys":[1],"mode":"single"}],"id":"q07"},{"prompt":"Which basic principle was strengthened when the Court ruled that a state monopoly could not interfere with interstate commerce regulated by Congress?","reading":"The state of New York granted Aaron Ogden an exclusive license to operate steamboats in waters between New York and New Jersey. Thomas Gibbons held a federal coasting license and continued to operate in the same waters. The Supreme Court ruled that regulating interstate commerce belongs to Congress, not individual states.","readingTitle":"Gibbons v. Ogden (1824)","hint":"This case expanded national power in an area shared with the states.","explanation":"Federalism with national control over interstate commerce — This case expanded national power in an area shared with the states.","parts":[{"prompt":"","choices":["Popular sovereignty","Federalism with national control over interstate commerce","State supremacy","Trial by jury"],"keys":[1],"mode":"single"}],"id":"q08"},{"prompt":"Which effect did this decision have on the powers of the national government?","reading":"In deciding Gibbons v. Ogden, the Court treated navigation between states as commerce and concluded that Congress has broad authority whenever economic activity crosses state boundaries.","readingTitle":"Gibbons v. Ogden (1824)","hint":"The Court broadened the meaning of commerce among the states.","explanation":"It expanded Congress’s authority to regulate interstate economic activity — The Court broadened the meaning of commerce among the states.","parts":[{"prompt":"","choices":["It reduced Congress to only taxing powers","It expanded Congress’s authority to regulate interstate economic activity","It allowed states to veto federal trade laws","It gave the Supreme Court power to create agencies"],"keys":[1],"mode":"single"}],"id":"q09"},{"prompt":"Which answer best explains why this case matters on the Ohio Government test?","reading":"In deciding Gibbons v. Ogden, the Court treated navigation between states as commerce and concluded that Congress has broad authority whenever economic activity crosses state boundaries.","readingTitle":"Gibbons v. Ogden (1824)","hint":"Think principle first: division of power between national and state governments.","explanation":"It is used to illustrate federalism and the expansion of national power — Think principle first: division of power between national and state governments.","parts":[{"prompt":"","choices":["It is used to illustrate federalism and the expansion of national power","It is used to explain the 19th Amendment","It is used to explain direct primaries","It is used to show how impeachment works"],"keys":[0],"mode":"single"}],"id":"q10"},{"prompt":"Which rule was strengthened when the Court said illegally obtained evidence could not be used in state courts?","reading":"Police officers entered Dollree Mapp’s home looking for a fugitive. They did not present a valid warrant, but they searched the home and found materials that were later used to convict her. Mapp appealed, arguing that the search violated the Constitution.","readingTitle":"Mapp v. Ohio (1961)","hint":"Evidence obtained through unconstitutional searches is excluded.","explanation":"Exclusionary Rule — Evidence obtained through unconstitutional searches is excluded.","parts":[{"prompt":"","choices":["Exclusionary Rule","Reserved powers doctrine","Pocket veto rule","Advice and consent rule"],"keys":[0],"mode":"single"}],"id":"q11"},{"prompt":"Which constitutional amendment was most directly involved in the Court’s concern about self-incrimination?","reading":"Ernesto Miranda confessed to police after hours of questioning. He had not been clearly informed that he had the right to remain silent and the right to an attorney. The Supreme Court ruled that suspects in custody must be informed of specific rights before interrogation.","readingTitle":"Miranda v. Arizona (1966)","hint":"The amendment protects a suspect from being forced to incriminate himself.","explanation":"Fifth Amendment — The amendment protects a suspect from being forced to incriminate himself.","parts":[{"prompt":"","choices":["Fourth Amendment","Fifth Amendment","Eighth Amendment","Tenth Amendment"],"keys":[1],"mode":"single"}],"id":"q12"},{"prompt":"Which pair of amendments is most likely to appear as plausible distractors on a question about Miranda?","reading":"In Miranda, the Court concluded that police questioning in custody can place pressure on suspects that undermines their constitutional rights unless officers explain those rights first.","readingTitle":"Miranda v. Arizona (1966)","hint":"Police investigation and confession questions often narrow to one of these two.","explanation":"4th and 5th Amendments — Police investigation and confession questions often narrow to one of these two.","parts":[{"prompt":"","choices":["1st and 2nd Amendments","4th and 5th Amendments","7th and 10th Amendments","12th and 14th Amendments"],"keys":[1],"mode":"single"}],"id":"q13"},{"prompt":"Which clue words in a passage should most strongly alert students to a Miranda-type question?","reading":"In Miranda, the Court concluded that police questioning in custody can place pressure on suspects that undermines their constitutional rights unless officers explain those rights first.","readingTitle":"Miranda v. Arizona (1966)","hint":"Focus on police questioning and admissions by a suspect.","explanation":"interrogation, confession, remain silent — Focus on police questioning and admissions by a suspect.","parts":[{"prompt":"","choices":["election, candidate, campaign","petition, assembly, press","interrogation, confession, remain silent","tax, bank, commerce"],"keys":[2],"mode":"single"}],"id":"q14"},{"prompt":"Which two amendments are most likely to appear together as plausible answer choices in a Gideon passage?","reading":"Ohio frequently presents Gideon as a two-step question: students must identify the amendment and then explain how the Court used the 14th Amendment to extend the right against state governments.","readingTitle":"Gideon v. Wainwright (1963)","hint":"Criminal trial rights often narrow to these two, but lawyer/counsel points to one of them.","explanation":"5th and 6th Amendments — Criminal trial rights often narrow to these two, but lawyer/counsel points to one of them.","parts":[{"prompt":"","choices":["5th and 6th Amendments","1st and 2nd Amendments","8th and 10th Amendments","12th and 14th Amendments"],"keys":[0],"mode":"single"}],"id":"q15"},{"prompt":"On the Ohio test, Brown is often used to illustrate the extension of civil rights to marginalized groups through the actions of which branch?","reading":"Brown overturned the idea that “separate but equal” facilities satisfied the Constitution in public education.","readingTitle":"Brown v. Board of Education (1954)","hint":"This result came from a Supreme Court ruling.","explanation":"Judicial branch — This result came from a Supreme Court ruling.","parts":[{"prompt":"","choices":["Judicial branch","Legislative branch","Executive branch","Local branch"],"keys":[0],"mode":"single"}],"id":"q16"},{"prompt":"Which group was most directly denied equal treatment under the system upheld by Plessy?","reading":"Plessy demonstrates that constitutional amendments do not automatically produce immediate equality. Even after the Reconstruction Amendments, governments and courts sometimes permitted discrimination to continue.","readingTitle":"Plessy v. Ferguson (1896)","hint":"Think post-Reconstruction segregation.","explanation":"African Americans — Think post-Reconstruction segregation.","parts":[{"prompt":"","choices":["Corporate shareholders","African Americans","Cabinet members","Foreign ambassadors"],"keys":[1],"mode":"single"}],"id":"q17"},{"prompt":"If Ohio uses this case in a question about the president removing executive officials, which branch interaction is being emphasized?","reading":"Myers is commonly used to test whether students understand the distinction between Congress making laws and the president controlling the personnel who execute those laws.","readingTitle":"Myers v. United States (1926)","hint":"The dispute involved Congress limiting the president.","explanation":"Executive vs. legislative branches — The dispute involved Congress limiting the president.","parts":[{"prompt":"","choices":["State vs. federal courts","Executive vs. legislative branches","Voters vs. political parties","Local vs. county government"],"keys":[1],"mode":"single"}],"id":"q18"},{"prompt":"Which answer best describes the educational purpose of this case on the state test?","reading":"Myers is commonly used to test whether students understand the distinction between Congress making laws and the president controlling the personnel who execute those laws.","readingTitle":"Myers v. United States (1926)","hint":"It is about branch structure, not rights or economics.","explanation":"To show how separation of powers shapes branch responsibilities — It is about branch structure, not rights or economics.","parts":[{"prompt":"","choices":["To show how monetary policy changes interest rates","To show how separation of powers shapes branch responsibilities","To explain jury selection in criminal trials","To compare the Ohio and U.S. constitutions"],"keys":[1],"mode":"single"}],"id":"q19"},{"prompt":"Which phrase best explains the Court’s reasoning in this case?","reading":"Chief Justice John Marshall explained that the Constitution grants Congress certain enumerated powers, but also gives Congress discretion to choose reasonable means to carry them out. He rejected Maryland’s attempt to treat federal institutions as subject to state control.","readingTitle":"McCulloch v. Maryland (1819)","hint":"The Court supported implied powers connected to listed powers.","explanation":"Congress may use implied powers to carry out delegated powers — The Court supported implied powers connected to listed powers.","parts":[{"prompt":"","choices":["States may interpret the Constitution however they choose","Congress may use implied powers to carry out delegated powers","The president may suspend laws during emergencies","Citizens may vote directly on national laws"],"keys":[1],"mode":"single"}],"id":"q20"},{"prompt":"What was the larger constitutional effect of this case?","reading":"Although the Supreme Court did not reverse Gitlow’s conviction, the case was still significant because it announced that key protections in the Bill of Rights could apply to state governments through the 14th Amendment.","readingTitle":"Gitlow v. New York (1925)","hint":"Think about the Bill of Rights reaching beyond only the federal government.","explanation":"It helped extend federal civil liberties protections to state and local governments — Think about the Bill of Rights reaching beyond only the federal government.","parts":[{"prompt":"","choices":["It increased the ability of states to ignore the Bill of Rights","It helped extend federal civil liberties protections to state and local governments","It gave Congress the power to appoint judges","It ended judicial review"],"keys":[1],"mode":"single"}],"id":"q21"},{"prompt":"Which clause of that amendment was most directly involved?","reading":"Linda Brown was denied admission to a public school closer to her home because the school was reserved for white students. The Supreme Court ruled that segregated public schools are inherently unequal and violate the Constitution.","readingTitle":"Brown v. Board of Education (1954)","hint":"Segregation and unequal treatment point here.","explanation":"Equal Protection Clause — Segregation and unequal treatment point here.","parts":[{"prompt":"","choices":["Equal Protection Clause","Necessary and Proper Clause","Free Exercise Clause","Supremacy Clause"],"keys":[0],"mode":"single"}],"id":"q22"},{"prompt":"Which Ohio content statement theme does this case most clearly support?","reading":"Plessy demonstrates that constitutional amendments do not automatically produce immediate equality. Even after the Reconstruction Amendments, governments and courts sometimes permitted discrimination to continue.","readingTitle":"Plessy v. Ferguson (1896)","hint":"This case shows rights on paper did not instantly end discrimination.","explanation":"The struggle to fully achieve equality continued despite new constitutional protections — This case shows rights on paper did not instantly end discrimination.","parts":[{"prompt":"","choices":["The struggle to fully achieve equality continued despite new constitutional protections","The Federal Reserve uses monetary tools to regulate the money supply","Political parties provide opportunities for civic involvement","Ohio judges are elected under the state constitution"],"keys":[0],"mode":"single"}],"id":"q23"},{"prompt":"Which constitutional principle is best illustrated by this decision?","reading":"During the Korean War, President Harry Truman ordered the seizure of steel mills to prevent a strike from disrupting war production. The steel companies challenged the order. The Supreme Court ruled that the president lacked authority to seize the mills because Congress had not authorized the action.","readingTitle":"Youngstown Sheet & Tube v. Sawyer (1952)","hint":"One branch restrained the action of another branch.","explanation":"Checks and balances — One branch restrained the action of another branch.","parts":[{"prompt":"","choices":["Popular sovereignty","Checks and balances","Reserved powers of the states","Direct democracy"],"keys":[1],"mode":"single"}],"id":"q24"},{"prompt":"A city jails a resident solely for peaceful criticism of the mayor. Which statement best explains the constitutional protection?","reading":"The Bill of Rights originally restricted federal government. Through selective incorporation, the Supreme Court has used the Fourteenth Amendment’s Due Process Clause to apply most Bill of Rights protections to state and local government. The rights assessed here under the First, Second, Fourth, Fifth, Sixth, and Eighth Amendments apply to states. The Tenth Amendment concerns reserved powers, rather than an incorporated individual right.","hint":"Use the supporting source. Use the reference passage and Section 1 of the Fourteenth Amendment.","explanation":"Through incorporation under the Fourteenth Amendment, the First Amendment’s speech protection applies to state and local governments.","parts":[{"prompt":"","choices":["The First Amendment protects the press, so only newspapers may criticize officials","The First Amendment protects speech, but only federal officials must respect it","The First Amendment protects assembly, so a person speaking alone has no protection","Incorporation applies First Amendment speech rights locally"],"keys":[3],"mode":"single"}],"topic":"First Amendment — incorporation","id":"q25"},{"prompt":"State officers search a home without a warrant, probable cause, or any valid exception. Officials claim the Fourth Amendment limits only federal officers. Which response is most accurate?","reading":"The Bill of Rights originally restricted federal government. Through selective incorporation, the Supreme Court has used the Fourteenth Amendment’s Due Process Clause to apply most Bill of Rights protections to state and local government. The rights assessed here under the First, Second, Fourth, Fifth, Sixth, and Eighth Amendments apply to states. The Tenth Amendment concerns reserved powers, rather than an incorporated individual right.","hint":"Use the supporting source. Use the reference passage and the Fourth Amendment’s search-and-seizure protection.","explanation":"The Fourth Amendment’s protection against unreasonable searches applies to state and local government through incorporation.","parts":[{"prompt":"","choices":["Incorporation binds state officers to the Fourth Amendment","Its trial protection allows state officers to search any home","Its speech protection requires a confession before any search","Its search protection applies only to federal officers"],"keys":[0],"mode":"single"}],"topic":"Fourth Amendment — incorporation","id":"q26"},{"prompt":"A state argues that the right to keep and bear arms can never restrict its laws because the Bill of Rights originally limited only federal government. Which response best applies incorporation?","reading":"The Bill of Rights originally restricted federal government. Through selective incorporation, the Supreme Court has used the Fourteenth Amendment’s Due Process Clause to apply most Bill of Rights protections to state and local government. The rights assessed here under the First, Second, Fourth, Fifth, Sixth, and Eighth Amendments apply to states. The Tenth Amendment concerns reserved powers, rather than an incorporated individual right.","hint":"Use the supporting source. Use the reference passage about incorporation and identify the right in Amendment II.","explanation":"Incorporation applies the Second Amendment’s right to keep and bear arms to state governments; particular regulations still require constitutional analysis.","parts":[{"prompt":"","choices":["The Second Amendment protects only public criminal trials","The Second Amendment guarantees every state law is valid","The Second Amendment applies only to federal government","The Second Amendment also binds states"],"keys":[3],"mode":"single"}],"topic":"Second Amendment — incorporation","id":"q27"},{"prompt":"A state prison deliberately imposes a torturous punishment. Officials say the Eighth Amendment restricts only federal prisons. Which response correctly applies incorporation?","reading":"The Bill of Rights originally restricted federal government. Through selective incorporation, the Supreme Court has used the Fourteenth Amendment’s Due Process Clause to apply most Bill of Rights protections to state and local government. The rights assessed here under the First, Second, Fourth, Fifth, Sixth, and Eighth Amendments apply to states. The Tenth Amendment concerns reserved powers, rather than an incorporated individual right.","hint":"Use the supporting source. Use the reference passage and Amendment VIII’s punishment protection.","explanation":"Incorporation makes the Eighth Amendment’s ban on cruel and unusual punishment enforceable against state government.","parts":[{"prompt":"","choices":["The ban on cruel and unusual punishment applies to states too","The ban on cruel and unusual punishment applies only federally","The right to a speedy trial allows any punishment after conviction","The right to bear arms replaces punishment protections in state prisons"],"keys":[0],"mode":"single"}],"topic":"Eighth Amendment — incorporation","id":"q28"},{"prompt":"After an acquittal, the same state prosecutes a defendant again for the same offense simply to seek a different verdict. Which statement correctly applies the Bill of Rights?","reading":"The Bill of Rights originally restricted federal government. Through selective incorporation, the Supreme Court has used the Fourteenth Amendment’s Due Process Clause to apply most Bill of Rights protections to state and local government. The rights assessed here under the First, Second, Fourth, Fifth, Sixth, and Eighth Amendments apply to states. The Tenth Amendment concerns reserved powers, rather than an incorporated individual right.","hint":"Use the supporting source. Use the reference passage and the same-offense clause of Amendment V.","explanation":"The Fifth Amendment’s protection against double jeopardy applies to state prosecutions through incorporation. Its self-incrimination protection also applies to states.","parts":[{"prompt":"","choices":["The Fifth Amendment’s double-jeopardy protection limits federal prosecutions alone","Incorporation applies double jeopardy protection to states","The Sixth Amendment’s counsel protection allows unlimited repeated prosecutions","The Tenth Amendment allows states to ignore incorporated criminal protections"],"keys":[1],"mode":"single"}],"topic":"Fifth Amendment — incorporation","id":"q29"},{"prompt":"Which statement best explains the doctrine of incorporation?","reading":"The Bill of Rights originally restricted federal government. Through selective incorporation, the Supreme Court has used the Fourteenth Amendment’s Due Process Clause to apply most Bill of Rights protections to state and local government. The rights assessed here under the First, Second, Fourth, Fifth, Sixth, and Eighth Amendments apply to states. The Tenth Amendment concerns reserved powers, rather than an incorporated individual right.","hint":"Use the supporting source. Use the reference passage and Section 1 of the Fourteenth Amendment.","explanation":"The Supreme Court has used the Fourteenth Amendment’s Due Process Clause to apply most Bill of Rights guarantees to state and local governments.","parts":[{"prompt":"","choices":["Most Bill of Rights guarantees apply to states via Amendment XIV","It lets states disregard constitutional rights whenever officials approve","It applies every Bill of Rights provision to states without exceptions","It transfers all reserved powers from states to the federal government"],"keys":[0],"mode":"single"}],"topic":"Incorporation — required rights","id":"q30"}]</script><script src="ost-game.js"></script></body></html>
