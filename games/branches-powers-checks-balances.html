<script src="basics-audit.js"></script><script id="deck" type="application/json">[{"prompt":"Following the Supreme Court’s decision in Brown v. Board of Education, which action helped enforce desegregation?","hint":"Think federal enforcement power.","explanation":"federal action was used in some cases to enforce desegregation.","parts":[{"prompt":"","choices":["Federal troops supported desegregation orders","The Supreme Court passed a new law","States ignored the ruling legally","The Electoral College was changed"],"keys":[0],"mode":"single"}],"id":"q01"},{"prompt":"Which example best shows congressional oversight of the executive branch?","hint":"Oversight often happens through hearings and investigations.","explanation":"hearings are a major oversight tool.","parts":[{"prompt":"","choices":["Holding hearings on agency actions","Issuing a court ruling","Negotiating a treaty","Writing a local ordinance"],"keys":[0],"mode":"single"}],"id":"q02"},{"prompt":"Which example best shows the legislative branch checking the judicial branch?","hint":"Congress can respond through the amendment process.","explanation":"constitutional amendments can override court interpretations.","parts":[{"prompt":"","choices":["Congress proposes a constitutional amendment after a court ruling","A court overturns a statute","The President vetoes a bill","An agency issues a regulation"],"keys":[0],"mode":"single"}],"id":"q03"},{"prompt":"Which branch is most responsible for creating statutes that become public policy?","hint":"Statutes are laws passed by Congress.","explanation":"the legislative branch creates statutes.","parts":[{"prompt":"","choices":["Executive","Judicial","Legislative","Interest groups"],"keys":[2],"mode":"single"}],"id":"q04"},{"prompt":"Which scenario best shows the executive branch implementing public policy?","hint":"Implementation is enforcement.","explanation":"agencies in the executive branch enforce policy.","parts":[{"prompt":"","choices":["A federal agency enforces environmental rules","Congress drafts a bill","A court issues an opinion","A voter signs a petition"],"keys":[0],"mode":"single"}],"id":"q05"},{"prompt":"Which statement best explains the purpose of dividing powers among branches?","hint":"Power is divided to prevent concentration.","explanation":"separation of powers prevents dominance by one branch.","parts":[{"prompt":"","choices":["To speed up every government action","To make one branch dominant","To prevent abuse of power by any single branch","To eliminate public disagreement"],"keys":[2],"mode":"single"}],"id":"q06"},{"prompt":"Which action is a check the Senate has on the President?","hint":"Advice and consent.","explanation":"the Senate confirms many presidential appointments.","parts":[{"prompt":"","choices":["Issuing executive orders","Confirming federal appointments","Declaring laws unconstitutional","Collecting taxes"],"keys":[1],"mode":"single"}],"id":"q07"},{"prompt":"Which statement best describes separation of powers?","hint":"Three branches, different jobs.","explanation":"separation of powers divides responsibilities among branches.","parts":[{"prompt":"","choices":["One branch performs all major functions","Different branches have different responsibilities","States control the national government","Courts make all policy decisions"],"keys":[1],"mode":"single"}],"id":"q08"},{"prompt":"Why are checks and balances important?","hint":"Prevent concentration of power.","explanation":"checks and balances prevent abuse by limiting branch power.","parts":[{"prompt":"","choices":["They eliminate elections","They prevent any one branch from becoming too powerful","They guarantee every policy succeeds","They give courts control of Congress"],"keys":[1],"mode":"single"}],"id":"q09"},{"prompt":"Which example best shows collaboration among branches to make policy?","hint":"Creation + approval + implementation.","explanation":"multiple branches can work together to produce policy.","parts":[{"prompt":"","choices":["Congress passes a law; the President signs it; agencies enforce it","A judge gives a speech","A mayor posts online","A citizen writes a blog"],"keys":[0],"mode":"single"}],"id":"q10"},{"prompt":"Which action is most directly associated with the judicial branch?","hint":"Courts interpret.","explanation":"the judicial branch interprets laws.","parts":[{"prompt":"","choices":["Enforcing laws","Interpreting laws and the Constitution","Writing legislation","Collecting taxes"],"keys":[1],"mode":"single"}],"id":"q11"},{"prompt":"Which action best shows branches interacting on civil rights policy?","hint":"Think court ruling + enforcement.","explanation":"civil-rights policy often involved judicial rulings and executive enforcement.","parts":[{"prompt":"","choices":["Courts issue rulings and executive officials enforce them","Mayors write federal statutes","State courts negotiate treaties","Congress appoints governors"],"keys":[0],"mode":"single"}],"id":"q12"},{"prompt":"Which action best shows Congress participating in foreign policy?","hint":"The Senate has a key role here.","explanation":"the Senate ratifies treaties.","parts":[{"prompt":"","choices":["Ratifying treaties","Issuing court decisions","Commanding troops in battle","Appointing cabinet members"],"keys":[0],"mode":"single"}],"id":"q13"},{"prompt":"Which is the best example of collaboration in creating public policy?","hint":"Think branches working together on policy creation and implementation.","explanation":"lawmaking plus agency implementation is collaboration in public policy.","parts":[{"prompt":"","choices":["Congress passes a law and executive agencies carry it out","A single judge writes a tax code","A governor negotiates all local laws alone","Voters replace all court decisions"],"keys":[0],"mode":"single"}],"id":"q14"},{"prompt":"Which entity of government is responsible for negotiating international treaties?","hint":"The President leads this function.","explanation":"the executive branch negotiates treaties.","parts":[{"prompt":"","choices":["Executive branch","Judicial branch","Legislative branch","State governments"],"keys":[0],"mode":"single"}],"id":"q15"},{"prompt":"Which sentence is an example of collaboration in helping create U.S. trade policy?","hint":"Two branches working together on a foreign-policy action.","explanation":"executive negotiation plus Senate ratification is collaboration.","parts":[{"prompt":"","choices":["The President negotiates a treaty and the Senate votes to ratify it.","A state court overturns a federal law.","The Supreme Court writes a law.","A mayor vetoes a bill passed by Congress."],"keys":[0],"mode":"single"}],"id":"q16"},{"prompt":"Which is an example of the legislative branch checking the executive branch?","hint":"Congress acts after the President acts.","explanation":"overriding a veto is a legislative check.","parts":[{"prompt":"","choices":["The President vetoes a bill","Congress overrides a veto","A court declares a law unconstitutional","A governor signs a state law"],"keys":[1],"mode":"single"}],"id":"q17"},{"prompt":"Which is an example of the judicial branch checking the legislative branch?","hint":"Judicial review.","explanation":"courts can declare laws unconstitutional.","parts":[{"prompt":"","choices":["A court strikes down a law as unconstitutional","Congress passes a bill","The President appoints a judge","A state legislature sets a budget"],"keys":[0],"mode":"single"}],"id":"q18"},{"prompt":"Which power belongs to the House of Representatives rather than the Senate?","hint":"Think taxes and money bills.","explanation":"revenue bills originate in the House.","parts":[{"prompt":"","choices":["Ratifying treaties","Trying impeachments","Introducing revenue bills","Confirming judges"],"keys":[2],"mode":"single"}],"id":"q19"},{"prompt":"Which situation could involve multiple branches because of a conflict between state and federal authority?","hint":"Federal courts + state resistance.","explanation":"state refusal to obey a federal court order can involve courts and executive enforcement.","parts":[{"prompt":"","choices":["A city changes bus routes","A state refuses to follow a federal court order","A school schedules a pep rally","A library buys new books"],"keys":[1],"mode":"single"}],"id":"q20"},{"prompt":"A federal agency creates detailed rules to carry out a law passed by Congress. This is an example of:","hint":"Agencies carry out laws.","explanation":"agencies implement public policy through enforcement and regulation.","parts":[{"prompt":"","choices":["Implementation of public policy","Judicial review","State nullification","Direct democracy"],"keys":[0],"mode":"single"}],"id":"q21"},{"prompt":"Which is an example of the executive branch checking the legislative branch?","hint":"Veto power.","explanation":"the President can veto bills passed by Congress.","parts":[{"prompt":"","choices":["The President vetoes a bill","Congress confirms a judge","A court hears a case","A state passes a law"],"keys":[0],"mode":"single"}],"id":"q22"},{"prompt":"If the President appoints a federal judge, what check prevents that decision from being final by itself?","hint":"Advice and consent.","explanation":"Senate confirmation is the check.","parts":[{"prompt":"","choices":["The House declares war","The Senate must confirm the appointment","The Supreme Court must approve all nominations","State governors can veto the appointment"],"keys":[1],"mode":"single"}],"id":"q23"},{"prompt":"Which branch of the federal government has the power to make laws?","hint":"Congress belongs to this branch.","explanation":"the legislative branch makes laws.","parts":[{"prompt":"","choices":["Executive","Judicial","Legislative","State governments"],"keys":[2],"mode":"single"}],"id":"q24"},{"prompt":"An agency proposes mandatory food labels. A trade association publishes voluntary guidelines, while Congress enacts a statute requiring disclosures. What most directly distinguishes the statute from the trade guidelines?","hint":"Focus on the constitutional mechanism or the evidence in the scenario.","explanation":"A statute creates legal duties. Voluntary industry guidelines do not carry that legal force.","parts":[{"prompt":"","choices":["The statute reflects industry preferences.","The statute imposes enforceable duties.","The guidelines bind every covered firm by law.","The guidelines exercise congressional authority."],"keys":[1],"mode":"single"}],"topic":"CS 12 • Law","id":"q25"},{"prompt":"Congress funds a safety program. An agency imposes a requirement beyond the authority Congress granted, and a court sets that requirement aside. Which account best explains what happened?","hint":"Focus on the constitutional mechanism or the evidence in the scenario.","explanation":"Congress makes law. Courts may hold agency actions unlawful when agencies exceed statutory authority.","parts":[{"prompt":"","choices":["Congress authorized the program; the court limited implementation.","The agency amended the law; the court appropriated funding.","Congress enforced the regulation; the court vetoed the budget.","The agency approved a statute; Congress reviewed the ruling."],"keys":[0],"mode":"single"}],"topic":"CS 12–13 • Synthesis","id":"q26"},{"prompt":"A president dislikes a federal judge’s decision. Why can the president not simply fire the judge?","hint":"Consider Article III tenure.","explanation":"Article III judges serve during good behavior and cannot be fired at will.","parts":[{"prompt":"","choices":["Judges hold protected tenure","Judges approve presidential orders","Judges are elected by voters","Judges control Senate votes"],"keys":[0],"mode":"single"}],"topic":"CS 13 • Independence","id":"q27"},{"prompt":"An agency says it cannot meet a deadline set by law. A committee holds hearings and proposes a revised deadline. Which account correctly distinguishes the two legislative actions?","hint":"Focus on the constitutional mechanism or the evidence in the scenario.","explanation":"Oversight gathers facts and examines enforcement. Changing a statutory deadline takes legislation.","parts":[{"prompt":"","choices":["The hearing changes the deadline; the bill executes the program.","The hearing is judicial review; the bill begins rule enforcement.","The hearing suspends the statute; the bill limits judicial tenure.","The hearing gathers information; a new law could change the deadline."],"keys":[3],"mode":"single"}],"topic":"CS 12–13 • Application","id":"q28"},{"prompt":"After a veto, lawmakers negotiate revisions with the president. Why might they do this?","hint":"Think about how a veto changes negotiations.","explanation":"A veto can encourage revision or an attempted override.","parts":[{"prompt":"","choices":["To replace the Senate trial process","To gain support for a revised bill","To require a judicial appointment","To suspend the amendment process"],"keys":[1],"mode":"single"}],"topic":"CS 13 • Cause/effect","id":"q29"},{"prompt":"A city ordinance requires restaurants to pass inspections. Why is this a law?","hint":"Look for binding government authority.","explanation":"A law is a binding rule enforced by government.","parts":[{"prompt":"","choices":["Government can enforce it","A court recommended it","Residents voted on it","A private association proposed it"],"keys":[0],"mode":"single"}],"topic":"CS 12 • Law","id":"q30"}]</script><script src="ost-game.js"></script></body></html>
