<script src="basics-audit.js"></script><script id="deck" type="application/json">[{"prompt":"Which statement best explains a similarity between the Ohio and U.S. Constitutions?","hint":"Power limited by structure.","explanation":"Both limit government power through checks and balances — Power limited by structure.","parts":[{"prompt":"","choices":["Both limit government power through checks and balances","Both allow unlimited legislative power","Both eliminate courts","Both grant executive life tenure"],"keys":[0],"mode":"single"}],"id":"q01"},{"prompt":"Which statement best explains why the 1851 Constitution reduced legislative dominance?","hint":"Response to problems under 1803.","explanation":"To prevent abuse of power and financial mismanagement — Response to problems under 1803.","parts":[{"prompt":"","choices":["To prevent abuse of power and financial mismanagement","To weaken democracy","To remove voters","To centralize authority"],"keys":[0],"mode":"single"}],"id":"q02"},{"prompt":"Why are initiative and referendum considered more direct forms of democracy?","hint":"Direct vote by people.","explanation":"Citizens vote directly on laws — Direct vote by people.","parts":[{"prompt":"","choices":["Citizens vote directly on laws","Courts decide policy","Governors appoint legislators","Congress reviews state bills"],"keys":[0],"mode":"single"}],"id":"q03"},{"prompt":"Which best describes the relationship between state and federal constitutions?","hint":"Supremacy Clause.","explanation":"State constitutions cannot conflict with the U.S. Constitution — Supremacy Clause.","parts":[{"prompt":"","choices":["State constitutions cannot conflict with the U.S. Constitution","State constitutions override federal law","They are unrelated","Federal law is optional"],"keys":[0],"mode":"single"}],"id":"q04"},{"prompt":"Why was the Ohio Constitution of 1851 adopted?","hint":"Legislative abuse & debt problems.","explanation":"To limit legislative power and state debt — Legislative abuse & debt problems.","parts":[{"prompt":"","choices":["To limit legislative power and state debt","To expand slavery","To eliminate courts","To reduce voter participation"],"keys":[0],"mode":"single"}],"id":"q05"},{"prompt":"Why were judges made elected positions in 1851?","hint":"More democratic control.","explanation":"To increase public accountability — More democratic control.","parts":[{"prompt":"","choices":["To increase public accountability","To weaken the judiciary","To eliminate courts","To centralize power"],"keys":[0],"mode":"single"}],"id":"q06"},{"prompt":"Why does civic responsibility matter in a state government?","hint":"Participation matters.","explanation":"It ensures government reflects the will of the people — Participation matters.","parts":[{"prompt":"","choices":["It ensures government reflects the will of the people","It eliminates elections","It removes legislative authority","It centralizes executive control"],"keys":[0],"mode":"single"}],"id":"q07"},{"prompt":"Why are initiative and referendum considered tools of reform?","hint":"Direct democracy tools.","explanation":"They allow citizens to bypass legislature — Direct democracy tools.","parts":[{"prompt":"","choices":["They allow citizens to bypass legislature","They increase federal control","They eliminate courts","They reduce elections"],"keys":[0],"mode":"single"}],"id":"q08"},{"prompt":"One problem under the 1803 Constitution was that the legislature had too much ___?","hint":"General Assembly dominance.","explanation":"Power — General Assembly dominance.","parts":[{"prompt":"","choices":["Power","Military authority","Judicial review","Executive independence"],"keys":[0],"mode":"single"}],"id":"q09"},{"prompt":"Which feature exists in the Ohio Constitution but not the U.S. Constitution?","hint":"Direct citizen lawmaking.","explanation":"Initiative and referendum — Direct citizen lawmaking.","parts":[{"prompt":"","choices":["Initiative and referendum","Bill of Rights","Separation of powers","Supremacy Clause"],"keys":[0],"mode":"single"}],"id":"q10"},{"prompt":"Ohio voters petition to place a proposed law before the electorate. Which comparison explains why the same procedure cannot create a federal law?","hint":"Review the constitutional rule or evidence in the scenario.","explanation":"Ohio’s Constitution reserves initiative power to the people. Federal statutes follow the congressional lawmaking process.","parts":[{"prompt":"","choices":["Ohio allows a citizen initiative; federal lawmaking goes through Congress.","Ohio voters exercise a federal referendum when they sign.","Both constitutions give voters a direct national lawmaking procedure.","The U.S. Constitution gives the president sole power to propose laws."],"keys":[0],"mode":"single"}],"id":"q11"},{"prompt":"A legislator argues that the governor should choose every Ohio judge because that is how federal judges are selected. Which correction is most accurate?","hint":"Review the constitutional rule or evidence in the scenario.","explanation":"Ohio generally elects its judges. The president nominates federal Article III judges with Senate confirmation.","parts":[{"prompt":"","choices":["Ohio generally elects judges; federal Article III judges are appointed.","All Ohio judges are appointed by the General Assembly.","Both systems elect judges in statewide contests.","Federal judges are chosen by the Supreme Court."],"keys":[0],"mode":"single"}],"id":"q12"},{"prompt":"A resident researches both sides of a school levy before casting a ballot. Why is this a meaningful civic action?","hint":"Why evaluate evidence before voting?","explanation":"Informed voting helps citizens make considered choices about public policy.","parts":[{"prompt":"","choices":["It substitutes for following election law","It gives the voter authority to cancel other votes","It promotes informed participation","It guarantees the resident’s preferred outcome"],"keys":[2],"mode":"single"}],"topic":"CS 16–17 • OST-Style Review","id":"q13"},{"prompt":"Residents organize to clean a park rather than ask government to do all the work. What does this best demonstrate?","hint":"What can citizens contribute outside elections?","explanation":"Volunteering is a civic responsibility that supports the community.","parts":[{"prompt":"","choices":["Citizenship includes voluntary service","Only elected officials have civic responsibilities","Volunteer activity replaces all public services","Voting is no longer necessary in a democracy"],"keys":[0],"mode":"single"}],"topic":"CS 16–17 • OST-Style Review","id":"q14"},{"prompt":"Ohio legislators pass a bill, the governor administers it, and courts interpret it. Which principle BEST explains their distinct roles?","hint":"Identify whether branches perform separate jobs or restrain each other.","explanation":"Separation of powers assigns legislative, executive, and judicial functions to different branches.","parts":[{"prompt":"","choices":["Checks and balances","Federal supremacy","Separation of powers","Popular sovereignty"],"keys":[2],"mode":"single"}],"topic":"CS 16–17 • OST-Style Review","id":"q15"},{"prompt":"An Ohio resident argues that a state restriction violates freedom of expression. Which comparison is most useful?","hint":"Compare protections rather than assuming only one document applies.","explanation":"Ohio and U.S. constitutional protections can both matter in a rights dispute.","parts":[{"prompt":"","choices":["Neither constitution restricts government actions","Only the Ohio Constitution can protect speech","Both constitutions protect expression","Only federal courts may consider rights claims"],"keys":[2],"mode":"single"}],"topic":"CS 16–17 • OST-Style Review","id":"q16"},{"prompt":"A mayor proposes spending that exceeds the city budget. Which response best demonstrates public accountability?","hint":"How can citizens monitor local officials?","explanation":"Public records and meetings enable residents to hold local officials accountable.","parts":[{"prompt":"","choices":["The mayor’s proposal automatically amends the constitution","Residents assume local budgets cannot be challenged","A federal president must approve each city purchase","Residents audit spending and question officials"],"keys":[3],"mode":"single"}],"topic":"CS 16–17 • OST-Style Review","id":"q17"},{"prompt":"A neighborhood group wants to change a county policy. Which strategy best combines civic rights and responsibilities?","hint":"Which approach both participates and respects others?","explanation":"Petitioning and respectful advocacy exercise rights while respecting fellow citizens.","parts":[{"prompt":"","choices":["Ignore the policy until a court acts without a case","Organize a petition and present evidence respectfully","Claim that disagreement eliminates others’ speech rights","Interrupt meetings so other residents cannot speak"],"keys":[1],"mode":"single"}],"topic":"CS 16–17 • OST-Style Review","id":"q18"},{"prompt":"Residents notice an unsafe intersection and want the appropriate government to respond. Which first step is most effective?","hint":"Find the level of government responsible for the road.","explanation":"Effective civic participation targets the responsible local or state agency with evidence.","parts":[{"prompt":"","choices":["Ask the Ohio Supreme Court to install traffic lights directly","Demand that the U.S. Senate redesign the intersection","Bring safety evidence to the road authority","Wait until a national constitutional amendment is passed"],"keys":[2],"mode":"single"}],"topic":"CS 16–17 • OST-Style Review","id":"q19"},{"prompt":"Ohio voters approve a proposed amendment despite opposition from state officials. Which idea does this outcome most directly express?","hint":"Who is the source of government authority?","explanation":"Popular sovereignty means government authority originates with the people.","parts":[{"prompt":"","choices":["Federal officials appoint Ohio voters","The governor possesses legislative supremacy","Government authority comes from the people","Judges control every constitutional change"],"keys":[2],"mode":"single"}],"topic":"CS 16–17 • OST-Style Review","id":"q20"},{"prompt":"A proposal would increase Ohio state borrowing dramatically. Which 1851 constitutional concern is most relevant?","hint":"Think about problems with public finance in early Ohio.","explanation":"The 1851 Ohio Constitution placed constraints on state debt.","parts":[{"prompt":"","choices":["Creating federal lifetime judgeships","Electing U.S. senators by direct vote","Giving the governor authority to declare war","Restraining state debt and financial risk"],"keys":[3],"mode":"single"}],"topic":"CS 16–17 • OST-Style Review","id":"q21"},{"prompt":"A governor announces that an executive order overrides every protection in the Ohio Constitution. Which response is most accurate?","hint":"What limits government officials even after an election?","explanation":"Limited government means executive officials must act within constitutional limits.","parts":[{"prompt":"","choices":["Only the federal president can challenge the order","Executive action remains limited by constitutional law","The governor may suspend constitutional limits at will","Executive orders amend the constitution automatically"],"keys":[1],"mode":"single"}],"topic":"CS 16–17 • OST-Style Review","id":"q22"},{"prompt":"A voter wants to influence a school board decision about bus routes. Which action offers the most direct opportunity?","hint":"Which body actually governs local school policy?","explanation":"School board meetings allow residents to address the officials responsible for district policy.","parts":[{"prompt":"","choices":["Petition Congress to appoint school board members","Request a presidential executive order","Offer comment at a school board meeting","Ask a federal appellate court to set the route"],"keys":[2],"mode":"single"}],"topic":"CS 16–17 • OST-Style Review","id":"q23"},{"prompt":"Ohio residents oppose a recently enacted state law and want voters to decide whether it should remain in force. Which tool fits that goal?","hint":"Review the constitutional rule or evidence in the scenario.","explanation":"A referendum allows voters to accept or reject a law already passed. An initiative proposes a new measure.","parts":[{"prompt":"","choices":["Referendum petition","Initiative petition proposing a new statute","Federal impeachment petition","Judicial appointment hearing"],"keys":[0],"mode":"single"}],"id":"q24"},{"prompt":"Which term matches this description: a process allowing Ohio citizens to propose a law or constitutional amendment?","hint":"Match the government action or concept to its precise definition.","explanation":"Initiative is a process allowing Ohio citizens to propose a law or constitutional amendment.","parts":[{"prompt":"","choices":["initiative","candidate","local public office","1851 Ohio Constitution"],"keys":[0],"mode":"single"}],"topic":"CS 16-17","id":"q25"},{"prompt":"A person fulfills jury duty despite missing work. What civic principle is best illustrated?","hint":"How does this service support public institutions?","explanation":"Jury service is an important civic duty supporting fair trials.","parts":[{"prompt":"","choices":["Only government employees have public obligations","Courts are unnecessary when citizens volunteer","Jury service is identical to voting in elections","Jury service supports the courts"],"keys":[3],"mode":"single"}],"topic":"CS 16–17 • OST-Style Review","id":"q26"},{"prompt":"The Ohio governor directs state agencies to carry out a newly enacted statute. Which branch is exercising its principal function?","hint":"Who implements enacted laws?","explanation":"The executive branch administers and enforces state law.","parts":[{"prompt":"","choices":["The federal legislative branch","The judicial branch","The legislative branch","The executive branch"],"keys":[3],"mode":"single"}],"topic":"CS 16–17 • OST-Style Review","id":"q27"},{"prompt":"The governor vetoes a bill and legislators consider overriding the veto. What is the central constitutional purpose of these actions?","hint":"Focus on the interaction between branches.","explanation":"Vetoes and overrides are checks that prevent one branch from dominating.","parts":[{"prompt":"","choices":["Transfer legislative power permanently to the governor","Give courts exclusive control over state policy","Prevent one branch from exercising unchecked authority","Allow voters to write the bill directly"],"keys":[2],"mode":"single"}],"topic":"CS 16–17 • OST-Style Review","id":"q28"},{"prompt":"Citizens draft a proposed Ohio law and collect signatures to place their proposal into the lawmaking process. What is this?","hint":"Did citizens propose a law or vote on an existing one?","explanation":"An initiative enables citizens to propose laws through a petition process.","parts":[{"prompt":"","choices":["A judicial appeal","A referendum","An executive veto","An initiative"],"keys":[3],"mode":"single"}],"topic":"CS 16–17 • OST-Style Review","id":"q29"},{"prompt":"A litigant loses in an Ohio court of appeals and seeks further review. Which institution is at the top of Ohio’s state judiciary?","hint":"Follow the state court hierarchy.","explanation":"The Supreme Court of Ohio is the highest court in Ohio’s state judicial system.","parts":[{"prompt":"","choices":["The Ohio Senate","The Supreme Court of Ohio","The U.S. House of Representatives","The county auditor"],"keys":[1],"mode":"single"}],"topic":"CS 16–17 • OST-Style Review","id":"q30"}]</script><script src="ost-game.js"></script></body></html>
