<script src="basics-audit.js"></script><script id="deck" type="application/json">[{"prompt":"Which amendment most directly supports incorporation of rights to states?","hint":"Due process clause.","explanation":"14th — Due process clause.","parts":[{"prompt":"","choices":["14th","10th","7th","3rd"],"keys":[0],"mode":"single"}],"id":"q01"},{"prompt":"Why was the 13th Amendment necessary?","hint":"Emancipation Proclamation only applied to rebelling states.","explanation":"To legally end slavery nationwide — Emancipation Proclamation only applied to rebelling states.","parts":[{"prompt":"","choices":["To legally end slavery nationwide","To expand westward","To limit immigration","To establish income tax"],"keys":[0],"mode":"single"}],"id":"q02"},{"prompt":"Why was the 14th Amendment needed after the Civil War?","hint":"Black Codes restricted freedmen.","explanation":"Southern states passed Black Codes — Black Codes restricted freedmen.","parts":[{"prompt":"","choices":["Southern states passed Black Codes","Women demanded voting rights","Immigration increased","New territories formed"],"keys":[0],"mode":"single"}],"id":"q03"},{"prompt":"Why was the 15th Amendment necessary?","hint":"Resistance to Reconstruction.","explanation":"States were denying Black men the vote — Resistance to Reconstruction.","parts":[{"prompt":"","choices":["States were denying Black men the vote","Women demanded suffrage","Poll taxes existed nationwide","Courts overturned slavery"],"keys":[0],"mode":"single"}],"id":"q04"},{"prompt":"Why did literacy tests and poll taxes exist?","hint":"Voting suppression.","explanation":"To prevent African Americans from voting — Voting suppression.","parts":[{"prompt":"","choices":["To prevent African Americans from voting","To fund schools","To register immigrants","To verify citizenship"],"keys":[0],"mode":"single"}],"id":"q05"},{"prompt":"Why was the 26th Amendment passed?","hint":"Old enough to fight.","explanation":"18-year-olds were drafted but couldn’t vote — Old enough to fight.","parts":[{"prompt":"","choices":["18-year-olds were drafted but couldn’t vote","Women protested","Poll taxes existed","Slavery returned"],"keys":[0],"mode":"single"}],"id":"q06"},{"prompt":"Why was the 12th Amendment necessary?","hint":"Jefferson vs Burr tie.","explanation":"To fix problems from the Election of 1800 — Jefferson vs Burr tie.","parts":[{"prompt":"","choices":["To fix problems from the Election of 1800","To expand voting rights","To end slavery","To regulate commerce"],"keys":[0],"mode":"single"}],"id":"q07"},{"prompt":"Why was the 25th Amendment clarified after JFK’s assassination?","hint":"1963 concerns.","explanation":"Uncertainty over presidential disability — 1963 concerns.","parts":[{"prompt":"","choices":["Uncertainty over presidential disability","Voting disputes","Civil Rights protests","Election fraud"],"keys":[0],"mode":"single"}],"id":"q08"},{"prompt":"Why did federal intervention become necessary during Civil Rights era?","hint":"State resistance.","explanation":"States failed to protect constitutional rights — State resistance.","parts":[{"prompt":"","choices":["States failed to protect constitutional rights","Immigration increased","Wars required change","Economic depression"],"keys":[0],"mode":"single"}],"id":"q09"},{"prompt":"What was the long-term effect of Jim Crow laws?","hint":"Late 19th to mid-20th century.","explanation":"Institutionalized racial segregation — Late 19th to mid-20th century.","parts":[{"prompt":"","choices":["Institutionalized racial segregation","Expanded suffrage","Strengthened equal protection","Ended discrimination"],"keys":[0],"mode":"single"}],"id":"q10"},{"prompt":"A state law gives legal protection to one racial group but denies it to another. Which clause is most directly involved?","hint":"Think equal treatment under state law.","explanation":"The Fourteenth Amendment requires states to provide equal protection to all persons.","parts":[{"prompt":"","choices":["Supremacy Clause","Establishment Clause","Necessary and Proper Clause","Equal Protection Clause"],"keys":[3],"mode":"single"}],"topic":"CS 9 • Fourteenth Amendment","id":"q11"},{"prompt":"A state takes a person’s property without notice or a fair hearing. Which protection is most directly involved?","hint":"The state skipped fair procedures.","explanation":"The Fourteenth Amendment prohibits states from depriving life, liberty, or property without due process.","parts":[{"prompt":"","choices":["Nineteenth Amendment suffrage","Fourteenth Amendment due process","Fifteenth Amendment voting protection","Twenty-second Amendment term limits"],"keys":[1],"mode":"single"}],"topic":"CS 9 • Fourteenth Amendment","id":"q12"},{"prompt":"A state registrar refuses an otherwise eligible citizen’s application solely because of race. Which constitutional reasoning most directly challenges that decision?","hint":"Focus on the constitutional mechanism or the evidence in the scenario.","explanation":"The Fifteenth Amendment specifically prohibits withholding the vote on account of race, color, or previous servitude.","parts":[{"prompt":"","choices":["The Nineteenth Amendment sets a uniform national voting age.","The Fifteenth Amendment bars denying the vote on racial grounds.","The Twenty-fourth Amendment guarantees access to state offices.","The Twenty-sixth Amendment prohibits race-based citizenship rules."],"keys":[1],"mode":"single"}],"topic":"CS 10 • Fifteenth Amendment","id":"q13"},{"prompt":"Which amendment most directly expanded the electorate during the Vietnam era?","hint":"“Old enough to fight, old enough to vote.”","explanation":"The Twenty-sixth Amendment lowered the voting age to 18.","parts":[{"prompt":"","choices":["Thirteenth Amendment","Twenty-third Amendment","Twenty-second Amendment","Twenty-sixth Amendment"],"keys":[3],"mode":"single"}],"topic":"CS 10 • Application","id":"q14"},{"prompt":"Which situation specifically calls for a Twenty-fifth Amendment disability procedure rather than ordinary succession after a presidential vacancy?","hint":"The key distinction is that the president is still in office but unable to serve temporarily.","explanation":"The Twenty-fifth Amendment provides procedures for transferring presidential powers when a president is unable to discharge the duties of the office.","parts":[{"prompt":"","choices":["The president finishes two elected terms and cannot run again.","The president remains in office but cannot temporarily serve.","The president resigns, creating a permanent vacancy in the office.","No candidate earns an Electoral College majority in the election."],"keys":[1],"mode":"single"}],"topic":"CS 11 • Twenty-fifth Amendment","id":"q15"},{"prompt":"A question mentions separate presidential and vice-presidential electoral ballots. Which amendment should you identify?","hint":"Separate ballots is the anchor phrase.","explanation":"The Twelfth Amendment changed Electoral College balloting.","parts":[{"prompt":"","choices":["Twenty-second Amendment","Twenty-fifth Amendment","Twenty-third Amendment","Twelfth Amendment"],"keys":[3],"mode":"single"}],"topic":"Mixed • Amendment identification","id":"q16"},{"prompt":"A state attempts to legally restore slavery. Which amendment most directly prohibits this action?","hint":"Think abolition.","explanation":"The Thirteenth Amendment abolished slavery and involuntary servitude, except as criminal punishment.","parts":[{"prompt":"","choices":["Nineteenth Amendment","Thirteenth Amendment","Twenty-second Amendment","Fourteenth Amendment"],"keys":[1],"mode":"single"}],"topic":"CS 9 • Thirteenth Amendment","id":"q17"},{"prompt":"A state refuses to register citizens because of their race. Which amendment is most directly violated?","hint":"Think race and voting.","explanation":"The Fifteenth Amendment forbids denial of voting rights based on race, color, or previous servitude.","parts":[{"prompt":"","choices":["Thirteenth Amendment","Nineteenth Amendment","Fifteenth Amendment","Twenty-third Amendment"],"keys":[2],"mode":"single"}],"topic":"CS 9 • Fifteenth Amendment","id":"q18"},{"prompt":"Residents of Washington, D.C., participate in a presidential election through electors. Which amendment made this possible?","hint":"Think the District of Columbia.","explanation":"The Twenty-third Amendment granted D.C. electoral votes.","parts":[{"prompt":"","choices":["Twelfth Amendment","Twenty-fifth Amendment","Twenty-third Amendment","Twenty-second Amendment"],"keys":[2],"mode":"single"}],"topic":"CS 11 • Twenty-third Amendment","id":"q19"},{"prompt":"An archive includes records of slavery ending, a freedperson asserting national citizenship, and a voter challenging a state’s racial exclusion. Which sequence matches these records to the Reconstruction Amendments?","hint":"Focus on the constitutional mechanism or the evidence in the scenario.","explanation":"The Reconstruction Amendments addressed abolition, citizenship and equality, and racial discrimination in voting in that order.","parts":[{"prompt":"","choices":["XIII: citizenship; XIV: abolition; XV: racial voting discrimination.","XIII: abolition; XIV: racial voting discrimination; XV: citizenship.","XIII: abolition; XIV: citizenship; XV: racial voting discrimination.","XIII: racial voting discrimination; XIV: citizenship; XV: abolition."],"keys":[2],"mode":"single"}],"topic":"CS 9 • Reconstruction","id":"q20"},{"prompt":"Which historical development most directly helped lead to adoption of the Twenty-second Amendment?","hint":"Think about the presidential tradition that changed during Franklin Roosevelt’s presidency.","explanation":"After Franklin D. Roosevelt was elected four times, the Twenty-second Amendment established constitutional limits on presidential tenure.","parts":[{"prompt":"","choices":["Congress repeatedly removed presidents through impeachment.","Electors stopped casting separate ballots for president and vice president.","Franklin D. Roosevelt was elected president four times.","Washington, D.C., gained votes in the Electoral College."],"keys":[2],"mode":"single"}],"topic":"CS 11 • Twenty-second Amendment / Cause and effect","id":"q21"},{"prompt":"A state government violates a protection in the Bill of Rights that has been applied to the states. Which constitutional principle allows that protection to be enforced against the state?","hint":"Think about how Bill of Rights protections came to apply to state governments.","explanation":"Through incorporation, many Bill of Rights protections have been applied to the states through the Fourteenth Amendment.","parts":[{"prompt":"","choices":["Incorporation through the Fourteenth Amendment","Supremacy through the Necessary and Proper Clause","Reserved powers under the Tenth Amendment","Presidential succession under the Twenty-fifth Amendment"],"keys":[0],"mode":"single"}],"topic":"CS 9 • Fourteenth Amendment / Incorporation","id":"q22"},{"prompt":"The president temporarily cannot perform official duties during a medical procedure. Which amendment provides a transfer process?","hint":"Think presidential inability.","explanation":"The Twenty-fifth Amendment addresses temporary presidential disability.","parts":[{"prompt":"","choices":["Twenty-second Amendment","Twenty-fourth Amendment","Twenty-fifth Amendment","Fourteenth Amendment"],"keys":[2],"mode":"single"}],"topic":"CS 11 • Twenty-fifth Amendment","id":"q23"},{"prompt":"A child is born in Ohio to parents who are not U.S. citizens. Which amendment establishes the child’s U.S. citizenship?","hint":"Think birthright citizenship.","explanation":"The Citizenship Clause recognizes persons born in the United States as citizens.","parts":[{"prompt":"","choices":["Fourteenth Amendment","Thirteenth Amendment","Twenty-sixth Amendment","Fifteenth Amendment"],"keys":[0],"mode":"single"}],"topic":"CS 9 • Fourteenth Amendment","id":"q24"},{"prompt":"Which conclusion is best supported by the history of Reconstruction and Jim Crow?","hint":"Compare the legal changes with what happened afterward.","explanation":"The gap between constitutional promise and lived equality persisted.","parts":[{"prompt":"","choices":["Voting rights alone immediately ended segregation nationwide.","Constitutional rights often require enforcement.","States always implemented new constitutional protections without opposition.","Constitutional amendments automatically change every local practice."],"keys":[1],"mode":"single"}],"topic":"CS 9 • Analysis","id":"q25"},{"prompt":"Which statement best connects CS 10 and CS 11?","hint":"Compare who may participate with how presidential government operates.","explanation":"CS 10 concerns access to voting; CS 11 concerns Electoral College and presidential procedures.","parts":[{"prompt":"","choices":["Both created equal protection requirements for state criminal trials.","Both abolished slavery and established citizenship through new amendments.","Both change voting or presidential rules.","Both replaced state elections with direct national presidential elections."],"keys":[2],"mode":"single"}],"topic":"Mixed • Analysis","id":"q26"},{"prompt":"Which cause-and-effect relationship is correct?","hint":"Match a barrier with the amendment addressing it.","explanation":"The Twenty-fourth Amendment removed a financial barrier to federal voting.","parts":[{"prompt":"","choices":["Poll taxes limited voting; the 24th banned them in federal elections.","The 19th restricted women’s votes; the 15th reversed that restriction.","The 26th increased the voting age; the 24th lowered it again.","The 15th created poll taxes; the 19th eliminated those taxes."],"keys":[0],"mode":"single"}],"topic":"CS 10 • Cause and effect","id":"q27"},{"prompt":"Why did the Reconstruction Amendments not produce immediate equality?","hint":"Constitutional text did not erase resistance and discriminatory enforcement.","explanation":"Jim Crow and other practices undermined constitutional protections for generations.","parts":[{"prompt":"","choices":["State governments could legally restore slavery under the amendments.","The amendments applied only to federal officials, not state laws.","The amendments permanently ended all racial discrimination.","Jim Crow laws and unequal enforcement persisted."],"keys":[3],"mode":"single"}],"topic":"CS 9 • Continued struggle","id":"q28"},{"prompt":"Why did poll taxes disenfranchise many poor citizens?","hint":"Focus on the financial barrier.","explanation":"Poll taxes conditioned voting on payment and were used to suppress African American voters.","parts":[{"prompt":"","choices":["A property requirement kept people from registering.","An age restriction prevented citizens under 21 from voting.","Poll taxes made voting unaffordable.","A literacy test excluded people unable to pass it."],"keys":[2],"mode":"single"}],"topic":"CS 10 • Poll taxes","id":"q29"},{"prompt":"Which statement best connects CS 9 and CS 10?","hint":"Think expanding constitutional inclusion over time.","explanation":"CS 9 establishes postwar protections; CS 10 traces continued suffrage expansion.","parts":[{"prompt":"","choices":["Reconstruction set presidential term limits; later amendments ended them.","Reconstruction guaranteed equal voting access; later amendments restricted it.","Reconstruction established the Electoral College; later amendments abolished it.","Reconstruction rights preceded later voting expansions."],"keys":[3],"mode":"single"}],"topic":"Mixed • Analysis","id":"q30"}]</script><script src="ost-game.js"></script></body></html>
